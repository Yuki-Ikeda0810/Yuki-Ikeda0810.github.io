name: Sync researchmap and deploy Pages

on:
  push:
  workflow_dispatch:
  schedule:
    # Every day at 08:10 JST (23:10 UTC).
    - cron: '10 23 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore last successful researchmap snapshot
        uses: actions/cache/restore@v5
        with:
          path: data/researchmap.json
          key: researchmap-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: researchmap-v1-
      - name: Sync public researchmap data
        run: python scripts/sync_researchmap.py --allow-stale
      - name: Verify sync behavior
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Save snapshot for the next run
        uses: actions/cache/save@v5
        with:
          path: data/researchmap.json
          key: researchmap-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare public files only
        run: |
          mkdir _site
          cp index.html _site/
          cp -r en assets img icon _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
